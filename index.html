    function getInitialReports() {

          statusHistory: [{ status: 'Menunggu Verifikasi', by: 'Budi Santoso', note: 'Laporan dikirim teknisi' }]
        },
        {

          technicianName: 'Andi Pratama',

          customerName: 'PT Kawasan Industri Jababeka',
          serviceType: 'Fumigasi',
          branch: 'Bekasi & Cikarang',
          screenshot: makeSampleImage('PT Kawasan Industri Jababeka', 'Fumigasi', `${CURRENT_YYYY_MM}-08`),

          statusHistory: [

    const DEFAULT_REWARD_CFG = {
      period: CURRENT_YYYY_MM,
      rewardPerApproved: 25000,
      minApprovedForBonus: 5,
      bonusAmount: 100000,
      criteriaDescription: 'Reward dihitung berdasarkan jumlah laporan Google Review yang disetujui dan memiliki data lengkap (bukan berdasarkan rating bintang atau sentimen ulasan).'
    };

    const REJECTION_REASONS = [
      'Screenshot tidak terbaca',
      'Screenshot bukan ulasan Google',
      'Screenshot duplikat',
      'Informasi laporan tidak sesuai'
    ];

    const SERVICE_TYPES = ['Anti Rayap', 'Pest Control', 'Fumigasi', 'Disinfeksi', 'Lainnya'];
    const BRANCHES = ['Jakarta Pusat', 'Jakarta Selatan', 'Bekasi & Cikarang', 'Tangerang', 'Depok & Bogor'];

    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);

    function compressAndHash(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 850;
            const w = img.width > maxW ? maxW : img.width;
            const h = img.width > maxW ? Math.round((img.height * maxW) / img.width) : img.height;
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
            let hash = 0;
            const sample = dataUrl.slice(0, 3500) + dataUrl.slice(-3500) + file.size;
            for (let i = 0; i < sample.length; i++) {
              hash = ((hash << 5) - hash) + sample.charCodeAt(i);
              hash |= 0;
            }
            resolve({ dataUrl, imageHash: `img_${Math.abs(hash)}_${file.size}` });
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function StatusBadge({ status }) {
      const cls = {
        'Menunggu Verifikasi': 'bg-amber-100 text-amber-800 border-amber-300',
        'Disetujui': 'bg-emerald-100 text-emerald-800 border-emerald-300',
        'Ditolak': 'bg-rose-100 text-rose-800 border-rose-300'
      }[status] || 'bg-slate-100 text-slate-700 border-slate-200';
      return <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-bold border ${cls}`}>{status}</span>;
    }

    function App() {
      const [users] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || DEMO_USERS);
      const [reports, setReports] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.REPORTS)) || getInitialReports());
      const [rewardCfg, setRewardCfg] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.REWARD_CFG)) || DEFAULT_REWARD_CFG);
      const [rewardPayouts, setRewardPayouts] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.REWARD_PAYOUTS)) || {});
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION)) || null);

      useEffect(() => { localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.REPORTS, JSON.stringify(reports)); }, [reports]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.REWARD_CFG, JSON.stringify(rewardCfg)); }, [rewardCfg]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.REWARD_PAYOUTS, JSON.stringify(rewardPayouts)); }, [rewardPayouts]);
      useEffect(() => {
        if (currentUser) localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(currentUser));
        else localStorage.removeItem(STORAGE_KEYS.SESSION);
      }, [currentUser]);

      const [tab, setTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const notify = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const [roleInput, setRoleInput] = useState('teknisi');
      const [idInput, setIdInput] = useState('TEK-001');
      const [passInput, setPassInput] = useState('123');
      const [loginErr, setLoginErr] = useState('');

      const [reviewDate, setReviewDate] = useState(TODAY_STR);
      const [customerName, setCustomerName] = useState('');
      const [serviceType, setServiceType] = useState('Anti Rayap');
      const [branch, setBranch] = useState('Jakarta Pusat');
      const [previewUrl, setPreviewUrl] = useState('');
      const [imgHash, setImgHash] = useState('');
      const [formErr, setFormErr] = useState('');
      const [dupWarn, setDupWarn] = useState('');
      const camRef = useRef(null);
      const galRef = useRef(null);

      const [activeReport, setActiveReport] = useState(null);
      const [rejectOpen, setRejectOpen] = useState(false);
      const [reasonChoice, setReasonChoice] = useState(REJECTION_REASONS[0]);
      const [customReason, setCustomReason] = useState('');
      const [noteInput, setNoteInput] = useState('');

      const [fMonth, setFMonth] = useState(CURRENT_YYYY_MM);
      const [fTech, setFTech] = useState('ALL');
      const [fStatus, setFStatus] = useState('ALL');
      const [fService, setFService] = useState('ALL');
      const [recapMonth, setRecapMonth] = useState(CURRENT_YYYY_MM);
      const [sortDesc, setSortDesc] = useState(true);

      const loginUser = (e) => {
        e.preventDefault();
        setLoginErr('');
        const hit = users.find(
          (u) =>
            u.role === roleInput &&
            (u.id.toLowerCase() === idInput.trim().toLowerCase() || u.username.toLowerCase() === idInput.trim().toLowerCase()) &&
            u.password === passInput
        );
        if (!hit) {
          setLoginErr('ID/Username atau password tidak sesuai.');
          return;
        }
        setCurrentUser(hit);
        setBranch(hit.branch || 'Jakarta Pusat');
        setTab('dashboard');
        notify(`Login berhasil sebagai ${hit.name}`);
      };

      const demoSignIn = (u) => {
        setCurrentUser(u);
        setBranch(u.branch || 'Jakarta Pusat');
        setTab('dashboard');
        notify(`Masuk sebagai ${u.name}`);
      };

      const onSelectFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!['image/jpeg', 'image/jpg', 'image/png'].includes(file.type)) {
          setFormErr('Format gambar harus JPG, JPEG, atau PNG.');
          return;
        }
        setFormErr('');
        const { dataUrl, imageHash } = await compressAndHash(file);
        setPreviewUrl(dataUrl);
        setImgHash(imageHash);
        const existing = reports.find((r) => r.imageHash === imageHash && r.status !== 'Ditolak');
        setDupWarn(
          existing
            ? `Peringatan: Screenshot sudah digunakan pada laporan ${existing.id} (${existing.customerName}). Satu screenshot hanya boleh diklaim satu kali.`
            : ''
        );
      };

      const submitReport = (e) => {
        e.preventDefault();
        setFormErr('');
        if (!customerName.trim()) {
          setFormErr('Nama pelanggan atau perusahaan wajib diisi.');
          return;
        }
        if (!previewUrl) {
          setFormErr('Screenshot Google Review wajib diunggah.');
          notify('Screenshot belum diunggah!', 'error');
          return;
        }
        if (reports.some((r) => r.imageHash === imgHash && r.status !== 'Ditolak')) {
          setFormErr('Screenshot duplikat tidak dapat diklaim ulang.');
          return;
        }
        const newItem = {
          id: `RPT-2026-${String(reports.length + 1).padStart(3, '0')}`,
          technicianId: currentUser.id,
          technicianName: currentUser.name,
          reviewDate,
          customerName: customerName.trim(),
          serviceType,
          branch,
          screenshot: previewUrl,
          imageHash: imgHash,
          status: 'Menunggu Verifikasi',
          rejectionReason: '',
          internalNote: '',
          createdAt: new Date().toISOString(),
          statusHistory: [{ status: 'Menunggu Verifikasi', by: currentUser.name, note: 'Laporan berhasil dikirim' }]
        };
        setReports([newItem, ...reports]);
        setCustomerName('');
        setPreviewUrl('');
        setImgHash('');
        setDupWarn('');
        setTab('dashboard');
        notify('Laporan berhasil dikirim dan sedang menunggu verifikasi admin.');
      };

      const verifyReport = (id, status) => {
        const reason = reasonChoice === 'Lainnya' ? customReason.trim() : reasonChoice;
        if (status === 'Ditolak' && !reason) {
          notify('Alasan penolakan wajib diisi.', 'error');
          return;
        }
        setReports((prev) =>
          prev.map((r) =>
            r.id === id
              ? {
                  ...r,
                  status,
                  rejectionReason: status === 'Ditolak' ? reason : '',
                  internalNote: noteInput.trim() || r.internalNote,
                  statusHistory: [
                    ...(r.statusHistory || []),
                    { status, by: currentUser.name, note: status === 'Ditolak' ? `Ditolak: ${reason}` : (noteInput.trim() || 'Disetujui') }
                  ]
                }
              : r
          )
        );
        setActiveReport(null);
        setRejectOpen(false);
        setNoteInput('');
        notify(`Laporan ${id} diperbarui menjadi ${status}.`);
      };

      const myReports = useMemo(() => reports.filter((r) => currentUser && r.technicianId === currentUser.id), [reports, currentUser]);

      const myStats = useMemo(() => {
        const m = myReports.filter((r) => r.reviewDate.startsWith(CURRENT_YYYY_MM));
        return {
          total: m.length,
          approved: m.filter((r) => r.status === 'Disetujui').length,
          pending: m.filter((r) => r.status === 'Menunggu Verifikasi').length,
          rejected: m.filter((r) => r.status === 'Ditolak').length
        };
      }, [myReports]);

      const filteredAdminReports = useMemo(
        () =>
          reports.filter((r) => {
            if (fMonth && !r.reviewDate.startsWith(fMonth)) return false;
            if (fTech !== 'ALL' && r.technicianId !== fTech) return false;
            if (fStatus !== 'ALL' && r.status !== fStatus) return false;
            if (fService !== 'ALL' && r.serviceType !== fService) return false;
            return true;
          }),
        [reports, fMonth, fTech, fStatus, fService]
      );

      const recapRows = useMemo(() => {
        const rows = users
          .filter((u) => u.role === 'teknisi')
          .map((t) => {
            const list = reports.filter((r) => r.technicianId === t.id && (!recapMonth || r.reviewDate.startsWith(recapMonth)));
            return {
              id: t.id,
              name: t.name,
              branch: t.branch,
              total: list.length,
              approved: list.filter((x) => x.status === 'Disetujui').length,
              pending: list.filter((x) => x.status === 'Menunggu Verifikasi').length,
              rejected: list.filter((x) => x.status === 'Ditolak').length
            };
          });
        return rows.sort((a, b) => (sortDesc ? b.approved - a.approved : a.approved - b.approved));
      }, [users, reports, recapMonth, sortDesc]);

      const rewardRows = useMemo(
        () =>
          users
            .filter((u) => u.role === 'teknisi')
            .map((t) => {
              const validCount = reports.filter(
                (r) => r.technicianId === t.id && r.reviewDate.startsWith(rewardCfg.period) && r.status === 'Disetujui' && r.customerName && r.screenshot
              ).length;
              const base = validCount * Number(rewardCfg.rewardPerApproved || 0);
              const bonus = validCount >= Number(rewardCfg.minApprovedForBonus || 999) ? Number(rewardCfg.bonusAmount || 0) : 0;
              const key = `${rewardCfg.period}_${t.id}`;
              return {
                id: t.id,
                name: t.name,
                validCount,
                totalReward: base + bonus,
                key,
                payoutStatus: rewardPayouts[key] || 'Belum Diproses'
              };
            }),
        [users, reports, rewardCfg, rewardPayouts]
      );

      const exportCsv = () => {
        const csv = [

          ...recapRows.map((r) => [`"${r.name}"`, r.total, r.approved, r.pending, r.rejected].join(','))

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Rekap_Insekta_${recapMonth || 'Semua'}.csv`;
        a.click();
        notify('CSV berhasil diunduh.');
      };

        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
              <div className="bg-[#034276] p-6 text-center text-white">
                <h1 className="text-xl font-extrabold">INSEKTA REVIEW TRACKER</h1>
                <p className="text-xs text-blue-200 mt-1">PT Insekta Fokustama</p>
              </div>
              <form onSubmit={loginUser} className="p-6 space-y-4">
                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => { setRoleInput('teknisi'); setIdInput('TEK-001'); setPassInput('123'); }}
                    className={`py-2 rounded-lg text-xs font-bold ${roleInput === 'teknisi' ? 'bg-[#034276] text-white' : 'text-slate-600'}`}
                  >
                    Teknisi
                  </button>
                  <button
                    type="button"
                    onClick={() => { setRoleInput('admin'); setIdInput('ADM-01'); setPassInput('123'); }}
                    className={`py-2 rounded-lg text-xs font-bold ${roleInput === 'admin' ? 'bg-[#034276] text-white' : 'text-slate-600'}`}
                  >
                    Admin / Marketing
                  </button>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ID Teknisi / Username</label>
                  <input value={idInput} onChange={(e) => setIdInput(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                  <input type="password" value={passInput} onChange={(e) => setPassInput(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border text-sm" required />
                </div>
                {loginErr && <p className="text-xs text-rose-600 font-semibold">{loginErr}</p>}
                <button type="submit" className="w-full py-3 rounded-xl bg-[#FEBA12] hover:bg-[#e5a50a] text-[#034276] font-extrabold text-sm">
                  Masuk
                </button>
                <div className="pt-3 border-t grid grid-cols-2 gap-2">
                  {DEMO_USERS.map((u) => (
                    <button key={u.id} type="button" onClick={() => demoSignIn(u)} className="p-2 rounded-lg border text-left hover:bg-slate-50">
                      <div className="text-xs font-bold text-[#034276] truncate">{u.name}</div>
                      <div className="text-[10px] text-slate-500">{u.id}</div>
                    </button>
                  ))}
                </div>
              </form>
            </div>
          </div>
        );
      }

      const menus =
        currentUser.role === 'teknisi'
          ? [
              { id: 'dashboard', label: 'Dashboard' },
              { id: 'submit', label: '+ Kirim Laporan' },
              { id: 'history', label: 'Riwayat' },
              { id: 'reward', label: 'Reward' }
            ]
          : [
              { id: 'dashboard', label: 'Verifikasi' },
              { id: 'recap', label: 'Rekap Bulanan' },
              { id: 'reward', label: 'Reward' }
            ];

      return (
        <div className="min-h-screen pb-20 md:pb-8">
          {toast && (
            <div className={`fixed top-4 right-4 left-4 md:left-auto md:w-96 z-50 p-3.5 rounded-xl text-white text-xs font-bold shadow-lg ${toast.type === 'error' ? 'bg-rose-600' : 'bg-[#034276]'}`}>
              {toast.message}
