    function getInitialReports() {

          statusHistory: [{ status: 'Menunggu Verifikasi', by: 'Budi Santoso', note: 'Laporan dikirim teknisi' }]
        },
        {

          technicianName: 'Andi Pratama',

          customerName: 'PT Kawasan Industri Jababeka',
          serviceType: 'Fumigasi',
          branch: 'Bekasi & Cikarang',
          screenshot: makeSampleImage('PT Kawasan Industri Jababeka', 'Fumigasi', `${CURRENT_YYYY_MM}-08`),

          statusHistory: [

    const DEFAULT_REWARD_CFG = {
      period: CURRENT_YYYY_MM,
      rewardPerApproved: 25000,
      minApprovedForBonus: 5,
      bonusAmount: 100000,
      criteriaDescription: 'Reward dihitung berdasarkan jumlah laporan Google Review yang disetujui dan memiliki data lengkap (bukan berdasarkan rating bintang atau sentimen ulasan).'
    };

    const REJECTION_REASONS = [
      'Screenshot tidak terbaca',
      'Screenshot bukan ulasan Google',
      'Screenshot duplikat',
      'Informasi laporan tidak sesuai'
    ];

    const SERVICE_TYPES = ['Anti Rayap', 'Pest Control', 'Fumigasi', 'Disinfeksi', 'Lainnya'];
    const BRANCHES = ['Jakarta Pusat', 'Jakarta Selatan', 'Bekasi & Cikarang', 'Tangerang', 'Depok & Bogor'];

    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n || 0);

    function compressAndHash(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 850;
            const w = img.width > maxW ? maxW : img.width;
            const h = img.width > maxW ? Math.round((img.height * maxW) / img.width) : img.height;
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
            let hash = 0;
            const sample = dataUrl.slice(0, 3500) + dataUrl.slice(-3500) + file.size;
            for (let i = 0; i < sample.length; i++) {
              hash = ((hash << 5) - hash) + sample.charCodeAt(i);
              hash |= 0;
            }
            resolve({ dataUrl, imageHash: `img_${Math.abs(hash)}_${file.size}` });
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function StatusBadge({ status }) {
      const cls = {
        'Menunggu Verifikasi': 'bg-amber-100 text-amber-800 border-amber-300',
        'Disetujui': 'bg-emerald-100 text-emerald-800 border-emerald-300',
        'Ditolak': 'bg-rose-100 text-rose-800 border-rose-300'
      }[status] || 'bg-slate-100 text-slate-700 border-slate-200';
      return <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-bold border ${cls}`}>{status}</span>;
    }

    function App() {
      const [users] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || DEMO_USERS);
      const [reports, setReports] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.REPORTS)) || getInitialReports());
      const [rewardCfg, setRewardCfg] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.REWARD_CFG)) || DEFAULT_REWARD_CFG);
      const [rewardPayouts, setRewardPayouts] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.REWARD_PAYOUTS)) || {});
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION)) || null);

      useEffect(() => { localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users)); }, [users]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.REPORTS, JSON.stringify(reports)); }, [reports]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.REWARD_CFG, JSON.stringify(rewardCfg)); }, [rewardCfg]);
      useEffect(() => { localStorage.setItem(STORAGE_KEYS.REWARD_PAYOUTS, JSON.stringify(rewardPayouts)); }, [rewardPayouts]);
      useEffect(() => {
        if (currentUser) localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(currentUser));
        else localStorage.removeItem(STORAGE_KEYS.SESSION);
      }, [currentUser]);

      const [tab, setTab] = useState('dashboard');
      const [toast, setToast] = useState(null);
      const notify = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const [roleInput, setRoleInput] = useState('teknisi');
      const [idInput, setIdInput] = useState('TEK-001');
      const [passInput, setPassInput] = useState('123');
      const [loginErr, setLoginErr] = useState('');

      const [reviewDate, setReviewDate] = useState(TODAY_STR);
      const [customerName, setCustomerName] = useState('');
      const [serviceType, setServiceType] = useState('Anti Rayap');
      const [branch, setBranch] = useState('Jakarta Pusat');
      const [previewUrl, setPreviewUrl] = useState('');
      const [imgHash, setImgHash] = useState('');
      const [formErr, setFormErr] = useState('');
      const [dupWarn, setDupWarn] = useState('');
      const camRef = useRef(null);
      const galRef = useRef(null);

      const [activeReport, setActiveReport] = useState(null);
      const [rejectOpen, setRejectOpen] = useState(false);
      const [reasonChoice, setReasonChoice] = useState(REJECTION_REASONS[0]);
      const [customReason, setCustomReason] = useState('');
      const [noteInput, setNoteInput] = useState('');

      const [fMonth, setFMonth] = useState(CURRENT_YYYY_MM);
      const [fTech, setFTech] = useState('ALL');
      const [fStatus, setFStatus] = useState('ALL');
      const [fService, setFService] = useState('ALL');
      const [recapMonth, setRecapMonth] = useState(CURRENT_YYYY_MM);
      const [sortDesc, setSortDesc] = useState(true);

      const loginUser = (e) => {
        e.preventDefault();
        setLoginErr('');
        const hit = users.find(
          (u) =>
            u.role === roleInput &&
            (u.id.toLowerCase() === idInput.trim().toLowerCase() || u.username.toLowerCase() === idInput.trim().toLowerCase()) &&
            u.password === passInput
        );
        if (!hit) {
          setLoginErr('ID/Username atau password tidak sesuai.');
          return;
        }
        setCurrentUser(hit);
        setBranch(hit.branch || 'Jakarta Pusat');
        setTab('dashboard');
        notify(`Login berhasil sebagai ${hit.name}`);
      };

      const demoSignIn = (u) => {
        setCurrentUser(u);
        setBranch(u.branch || 'Jakarta Pusat');
        setTab('dashboard');
        notify(`Masuk sebagai ${u.name}`);
      };

      const onSelectFile = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!['image/jpeg', 'image/jpg', 'image/png'].includes(file.type)) {
          setFormErr('Format gambar harus JPG, JPEG, atau PNG.');
          return;
        }
        setFormErr('');
        const { dataUrl, imageHash } = await compressAndHash(file);
        setPreviewUrl(dataUrl);
        setImgHash(imageHash);
        const existing = reports.find((r) => r.imageHash === imageHash && r.status !== 'Ditolak');
        setDupWarn(
          existing
            ? `Peringatan: Screenshot sudah digunakan pada laporan ${existing.id} (${existing.customerName}). Satu screenshot hanya boleh diklaim satu kali.`
            : ''
        );
      };

      const submitReport = (e) => {
        e.preventDefault();
        setFormErr('');
        if (!customerName.trim()) {
          setFormErr('Nama pelanggan atau perusahaan wajib diisi.');
          return;
        }
        if (!previewUrl) {
          setFormErr('Screenshot Google Review wajib diunggah.');
          notify('Screenshot belum diunggah!', 'error');
          return;
        }
        if (reports.some((r) => r.imageHash === imgHash && r.status !== 'Ditolak')) {
          setFormErr('Screenshot duplikat tidak dapat diklaim ulang.');
          return;
        }
        const newItem = {
          id: `RPT-2026-${String(reports.length + 1).padStart(3, '0')}`,
          technicianId: currentUser.id,
          technicianName: currentUser.name,
          reviewDate,
          customerName: customerName.trim(),
          serviceType,
          branch,
          screenshot: previewUrl,
          imageHash: imgHash,
          status: 'Menunggu Verifikasi',
          rejectionReason: '',
          internalNote: '',
          createdAt: new Date().toISOString(),
          statusHistory: [{ status: 'Menunggu Verifikasi', by: currentUser.name, note: 'Laporan berhasil dikirim' }]
        };
        setReports([newItem, ...reports]);
        setCustomerName('');
        setPreviewUrl('');
        setImgHash('');
        setDupWarn('');
        setTab('dashboard');
        notify('Laporan berhasil dikirim dan sedang menunggu verifikasi admin.');
      };

      const verifyReport = (id, status) => {
        const reason = reasonChoice === 'Lainnya' ? customReason.trim() : reasonChoice;
        if (status === 'Ditolak' && !reason) {
          notify('Alasan penolakan wajib diisi.', 'error');
          return;
        }
        setReports((prev) =>
          prev.map((r) =>
            r.id === id
              ? {
                  ...r,
                  status,
                  rejectionReason: status === 'Ditolak' ? reason : '',
                  internalNote: noteInput.trim() || r.internalNote,
                  statusHistory: [
                    ...(r.statusHistory || []),
                    { status, by: currentUser.name, note: status === 'Ditolak' ? `Ditolak: ${reason}` : (noteInput.trim() || 'Disetujui') }
                  ]
                }
              : r
          )
        );
        setActiveReport(null);
        setRejectOpen(false);
        setNoteInput('');
        notify(`Laporan ${id} diperbarui menjadi ${status}.`);
      };

      const myReports = useMemo(() => reports.filter((r) => currentUser && r.technicianId === currentUser.id), [reports, currentUser]);

      const myStats = useMemo(() => {
        const m = myReports.filter((r) => r.reviewDate.startsWith(CURRENT_YYYY_MM));
        return {
          total: m.length,
          approved: m.filter((r) => r.status === 'Disetujui').length,
          pending: m.filter((r) => r.status === 'Menunggu Verifikasi').length,
          rejected: m.filter((r) => r.status === 'Ditolak').length
        };
      }, [myReports]);

      const filteredAdminReports = useMemo(
        () =>
          reports.filter((r) => {
            if (fMonth && !r.reviewDate.startsWith(fMonth)) return false;
            if (fTech !== 'ALL' && r.technicianId !== fTech) return false;
            if (fStatus !== 'ALL' && r.status !== fStatus) return false;
            if (fService !== 'ALL' && r.serviceType !== fService) return false;
            return true;
          }),
        [reports, fMonth, fTech, fStatus, fService]
      );

      const recapRows = useMemo(() => {
        const rows = users
          .filter((u) => u.role === 'teknisi')
          .map((t) => {
            const list = reports.filter((r) => r.technicianId === t.id && (!recapMonth || r.reviewDate.startsWith(recapMonth)));
            return {
              id: t.id,
              name: t.name,
              branch: t.branch,
              total: list.length,
              approved: list.filter((x) => x.status === 'Disetujui').length,
              pending: list.filter((x) => x.status === 'Menunggu Verifikasi').length,
              rejected: list.filter((x) => x.status === 'Ditolak').length
            };
          });
        return rows.sort((a, b) => (sortDesc ? b.approved - a.approved : a.approved - b.approved));
      }, [users, reports, recapMonth, sortDesc]);

      const rewardRows = useMemo(
        () =>
          users
            .filter((u) => u.role === 'teknisi')
            .map((t) => {
              const validCount = reports.filter(
                (r) => r.technicianId === t.id && r.reviewDate.startsWith(rewardCfg.period) && r.status === 'Disetujui' && r.customerName && r.screenshot
              ).length;
              const base = validCount * Number(rewardCfg.rewardPerApproved || 0);
              const bonus = validCount >= Number(rewardCfg.minApprovedForBonus || 999) ? Number(rewardCfg.bonusAmount || 0) : 0;
              const key = `${rewardCfg.period}_${t.id}`;
              return {
                id: t.id,
                name: t.name,
                validCount,
                totalReward: base + bonus,
                key,
                payoutStatus: rewardPayouts[key] || 'Belum Diproses'
              };
            }),
        [users, reports, rewardCfg, rewardPayouts]
      );

      const exportCsv = () => {
        const csv = [

          ...recapRows.map((r) => [`"${r.name}"`, r.total, r.approved, r.pending, r.rejected].join(','))

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Rekap_Insekta_${recapMonth || 'Semua'}.csv`;
        a.click();
        notify('CSV berhasil diunduh.');
      };

        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-100">
            <div className="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
              <div className="bg-[#034276] p-6 text-center text-white">
                <h1 className="text-xl font-extrabold">INSEKTA REVIEW TRACKER</h1>
                <p className="text-xs text-blue-200 mt-1">PT Insekta Fokustama</p>
              </div>
              <form onSubmit={loginUser} className="p-6 space-y-4">
                <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                  <button
                    type="button"
                    onClick={() => { setRoleInput('teknisi'); setIdInput('TEK-001'); setPassInput('123'); }}
                    className={`py-2 rounded-lg text-xs font-bold ${roleInput === 'teknisi' ? 'bg-[#034276] text-white' : 'text-slate-600'}`}
                  >
                    Teknisi
                  </button>
                  <button
                    type="button"
                    onClick={() => { setRoleInput('admin'); setIdInput('ADM-01'); setPassInput('123'); }}
                    className={`py-2 rounded-lg text-xs font-bold ${roleInput === 'admin' ? 'bg-[#034276] text-white' : 'text-slate-600'}`}
                  >
                    Admin / Marketing
                  </button>
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">ID Teknisi / Username</label>
                  <input value={idInput} onChange={(e) => setIdInput(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Password</label>
                  <input type="password" value={passInput} onChange={(e) => setPassInput(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border text-sm" required />
                </div>
                {loginErr && <p className="text-xs text-rose-600 font-semibold">{loginErr}</p>}
                <button type="submit" className="w-full py-3 rounded-xl bg-[#FEBA12] hover:bg-[#e5a50a] text-[#034276] font-extrabold text-sm">
                  Masuk
                </button>
                <div className="pt-3 border-t grid grid-cols-2 gap-2">
                  {DEMO_USERS.map((u) => (
                    <button key={u.id} type="button" onClick={() => demoSignIn(u)} className="p-2 rounded-lg border text-left hover:bg-slate-50">
                      <div className="text-xs font-bold text-[#034276] truncate">{u.name}</div>
                      <div className="text-[10px] text-slate-500">{u.id}</div>
                    </button>
                  ))}
                </div>
              </form>
            </div>
          </div>
        );
      }

      const menus =
        currentUser.role === 'teknisi'
          ? [
              { id: 'dashboard', label: 'Dashboard' },
              { id: 'submit', label: '+ Kirim Laporan' },
              { id: 'history', label: 'Riwayat' },
              { id: 'reward', label: 'Reward' }
            ]
          : [
              { id: 'dashboard', label: 'Verifikasi' },
              { id: 'recap', label: 'Rekap Bulanan' },
              { id: 'reward', label: 'Reward' }
            ];

      return (
        <div className="min-h-screen pb-20 md:pb-8">
          {toast && (
            <div className={`fixed top-4 right-4 left-4 md:left-auto md:w-96 z-50 p-3.5 rounded-xl text-white text-xs font-bold shadow-lg ${toast.type === 'error' ? 'bg-rose-600' : 'bg-[#034276]'}`}>
              {toast.message}
            </div>
          )}

          <header className="bg-[#034276] text-white sticky top-0 z-30 shadow no-print">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
              <div className="font-extrabold text-sm md:text-base">INSEKTA REVIEW TRACKER</div>
              <nav className="hidden md:flex gap-1">
                {menus.map((m) => (
                  <button
                    key={m.id}
                    onClick={() => setTab(m.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === m.id ? 'bg-[#FEBA12] text-[#034276]' : 'text-blue-100 hover:bg-white/10'}`}
                  >
                    {m.label}
                  </button>
                ))}
              </nav>
              <div className="flex items-center gap-2">
                <span className="hidden sm:inline text-xs font-semibold">{currentUser.name}</span>
                <button onClick={() => setCurrentUser(null)} className="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold">
                  Keluar
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-5">
            {currentUser.role === 'teknisi' && tab === 'dashboard' && (
              <div className="space-y-5">
                <div className="bg-[#034276] text-white p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <div className="text-xs text-[#FEBA12] font-bold">{currentUser.id} • {currentUser.branch}</div>
                    <h2 className="text-xl font-extrabold">Halo, {currentUser.name}</h2>
                  </div>
                  <button onClick={() => setTab('submit')} className="px-4 py-3 rounded-xl bg-[#FEBA12] text-[#034276] font-extrabold text-sm shadow">
                    + Kirim Laporan Google Review
                  </button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-slate-500">Total Bulan Ini</div><div className="text-2xl font-extrabold text-[#034276]">{myStats.total}</div></div>
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-emerald-700">Disetujui</div><div className="text-2xl font-extrabold text-emerald-600">{myStats.approved}</div></div>
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-amber-700">Menunggu Verifikasi</div><div className="text-2xl font-extrabold text-amber-600">{myStats.pending}</div></div>
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-rose-700">Ditolak</div><div className="text-2xl font-extrabold text-rose-600">{myStats.rejected}</div></div>
                </div>
                <div className="bg-white rounded-2xl border divide-y">
                  <div className="p-4 font-extrabold text-sm text-[#034276]">Riwayat Laporan Terbaru</div>
                  {myReports.slice(0, 5).map((r) => (
                    <div key={r.id} onClick={() => setActiveReport(r)} className="p-4 flex items-center justify-between gap-3 cursor-pointer hover:bg-slate-50">
                      <div className="flex items-center gap-3">
                        <img src={r.screenshot} alt="" className="w-12 h-12 rounded-lg object-cover border" />
                        <div>
                          <div className="font-bold text-sm">{r.customerName}</div>
                          <div className="text-xs text-slate-500">{r.serviceType} • {r.reviewDate}</div>
                          {r.status === 'Ditolak' && <div className="text-xs text-rose-600 font-semibold mt-0.5">Alasan: {r.rejectionReason}</div>}
                        </div>
                      </div>
                      <StatusBadge status={r.status} />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {currentUser.role === 'teknisi' && tab === 'submit' && (
              <form onSubmit={submitReport} className="max-w-xl mx-auto bg-white p-5 rounded-2xl border space-y-4">
                <h2 className="text-lg font-extrabold text-[#034276]">Form Kirim Laporan Google Review</h2>
                <div>
                  <label className="block text-xs font-bold mb-1">Nama Teknisi</label>
                  <input value={currentUser.name} disabled className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 border text-sm" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold mb-1">Tanggal Google Review *</label>
                    <input type="date" value={reviewDate} onChange={(e) => setReviewDate(e.target.value)} max={TODAY_STR} className="w-full px-3.5 py-2.5 rounded-xl border text-sm" required />
                  </div>
                  <div>
                    <label className="block text-xs font-bold mb-1">Jenis Layanan *</label>
                    <select value={serviceType} onChange={(e) => setServiceType(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border text-sm bg-white">
                      {SERVICE_TYPES.map((s) => <option key={s}>{s}</option>)}
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Nama Pelanggan / Perusahaan *</label>
                  <input value={customerName} onChange={(e) => setCustomerName(e.target.value)} placeholder="Contoh: PT Maju Jaya" className="w-full px-3.5 py-2.5 rounded-xl border text-sm" required />
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Lokasi / Cabang Layanan *</label>
                  <select value={branch} onChange={(e) => setBranch(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border text-sm bg-white">
                    {BRANCHES.map((b) => <option key={b}>{b}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold mb-1">Screenshot Google Review (JPG/JPEG/PNG) *</label>
                  <input ref={camRef} type="file" accept="image/jpeg,image/jpg,image/png" capture="environment" onChange={onSelectFile} className="hidden" />
                  <input ref={galRef} type="file" accept="image/jpeg,image/jpg,image/png" onChange={onSelectFile} className="hidden" />
                  {!previewUrl ? (
                    <div className="grid grid-cols-2 gap-2.5 p-4 border-2 border-dashed rounded-xl bg-slate-50">
                      <button type="button" onClick={() => camRef.current?.click()} className="py-3 rounded-xl bg-[#034276] text-white text-xs font-bold">Ambil Kamera HP</button>
                      <button type="button" onClick={() => galRef.current?.click()} className="py-3 rounded-xl bg-white border text-xs font-bold">Pilih dari Galeri</button>
                    </div>
                  ) : (
                    <div className="p-3 border rounded-xl bg-slate-50 space-y-2">
                      <img src={previewUrl} alt="Preview" className="max-h-64 mx-auto rounded-lg object-contain" />
                      <div className="flex gap-2">
                        <button type="button" onClick={() => galRef.current?.click()} className="flex-1 py-2 rounded-lg border bg-white text-xs font-bold">Ganti Gambar</button>
                        <button type="button" onClick={() => { setPreviewUrl(''); setImgHash(''); setDupWarn(''); }} className="px-3 py-2 rounded-lg bg-rose-50 text-rose-700 text-xs font-bold">Hapus</button>
                      </div>
                    </div>
                  )}
                </div>
                {dupWarn && <div className="p-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-xs font-semibold">{dupWarn}</div>}
                {formErr && <div className="p-3 rounded-xl bg-rose-50 border border-rose-300 text-rose-700 text-xs font-bold">{formErr}</div>}
                <button type="submit" className="w-full py-3 rounded-xl bg-[#FEBA12] text-[#034276] font-extrabold text-sm">Kirim Laporan</button>
              </form>
            )}

            {currentUser.role === 'teknisi' && tab === 'history' && (
              <div className="bg-white rounded-2xl border overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 border-b text-xs uppercase text-slate-600">
                    <tr>
                      <th className="p-3.5">Tanggal</th>
                      <th className="p-3.5">Pelanggan</th>
                      <th className="p-3.5">Layanan</th>
                      <th className="p-3.5">Bukti</th>
                      <th className="p-3.5">Status</th>
                      <th className="p-3.5">Catatan Admin</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y">
                    {myReports.map((r) => (
                      <tr key={r.id} onClick={() => setActiveReport(r)} className="hover:bg-slate-50 cursor-pointer">
                        <td className="p-3.5 text-xs">{r.reviewDate}</td>
                        <td className="p-3.5 font-bold">{r.customerName}</td>
                        <td className="p-3.5 text-xs">{r.serviceType}</td>
                        <td className="p-3.5"><img src={r.screenshot} alt="" className="w-11 h-11 rounded object-cover border" /></td>
                        <td className="p-3.5"><StatusBadge status={r.status} /></td>
                        <td className="p-3.5 text-xs text-rose-700">{r.status === 'Ditolak' ? r.rejectionReason : (r.internalNote || '-')}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {currentUser.role === 'admin' && tab === 'dashboard' && (
              <div className="space-y-4">
                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-slate-500">Total Laporan</div><div className="text-2xl font-extrabold text-[#034276]">{filteredAdminReports.length}</div></div>
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-amber-700">Menunggu</div><div className="text-2xl font-extrabold text-amber-600">{filteredAdminReports.filter((x) => x.status === 'Menunggu Verifikasi').length}</div></div>
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-emerald-700">Disetujui</div><div className="text-2xl font-extrabold text-emerald-600">{filteredAdminReports.filter((x) => x.status === 'Disetujui').length}</div></div>
                  <div className="bg-white p-4 rounded-xl border"><div className="text-xs text-rose-700">Ditolak</div><div className="text-2xl font-extrabold text-rose-600">{filteredAdminReports.filter((x) => x.status === 'Ditolak').length}</div></div>
                  <div className="bg-[#034276] text-white p-4 rounded-xl col-span-2 md:col-span-1"><div className="text-xs text-blue-200">Teknisi Aktif</div><div className="text-2xl font-extrabold text-[#FEBA12]">{new Set(filteredAdminReports.map((x) => x.technicianId)).size}</div></div>
                </div>

                <div className="bg-white p-4 rounded-2xl border grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                  <input type="month" value={fMonth} onChange={(e) => setFMonth(e.target.value)} className="px-3 py-2 rounded-lg border font-semibold" />
                  <select value={fTech} onChange={(e) => setFTech(e.target.value)} className="px-3 py-2 rounded-lg border font-semibold bg-white">
                    <option value="ALL">Semua Teknisi</option>
                    {users.filter((u) => u.role === 'teknisi').map((u) => <option key={u.id} value={u.id}>{u.name}</option>)}
                  </select>
                  <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className="px-3 py-2 rounded-lg border font-semibold bg-white">
                    <option value="ALL">Semua Status</option>
                    <option>Menunggu Verifikasi</option>
                    <option>Disetujui</option>
                    <option>Ditolak</option>
                  </select>
                  <select value={fService} onChange={(e) => setFService(e.target.value)} className="px-3 py-2 rounded-lg border font-semibold bg-white">
                    <option value="ALL">Semua Layanan</option>
                    {SERVICE_TYPES.map((s) => <option key={s}>{s}</option>)}
                  </select>
                </div>

                <div className="bg-white rounded-2xl border overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 border-b text-xs uppercase text-slate-600">
                      <tr>
                        <th className="p-3.5">Tanggal</th>
                        <th className="p-3.5">Teknisi</th>
                        <th className="p-3.5">Pelanggan</th>
                        <th className="p-3.5">Screenshot</th>
                        <th className="p-3.5">Status</th>
                        <th className="p-3.5 text-right">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {filteredAdminReports.map((r) => (
                        <tr key={r.id}>
                          <td className="p-3.5 text-xs">{r.reviewDate}</td>
                          <td className="p-3.5 font-bold text-xs">{r.technicianName}</td>
                          <td className="p-3.5 font-bold">{r.customerName} <span className="block text-xs font-normal text-slate-500">{r.serviceType}</span></td>
                          <td className="p-3.5"><img src={r.screenshot} alt="" className="w-12 h-12 rounded object-cover border cursor-pointer" onClick={() => { setActiveReport(r); setRejectOpen(false); setNoteInput(r.internalNote || ''); }} /></td>
                          <td className="p-3.5"><StatusBadge status={r.status} /></td>
                          <td className="p-3.5 text-right">
                            <button onClick={() => { setActiveReport(r); setRejectOpen(false); setNoteInput(r.internalNote || ''); }} className="px-3 py-1.5 rounded-lg bg-[#034276] text-white text-xs font-bold">
                              Periksa
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {currentUser.role === 'admin' && tab === 'recap' && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl border flex flex-wrap items-center justify-between gap-3 no-print">
                  <div className="flex items-center gap-2">
                    <input type="month" value={recapMonth} onChange={(e) => setRecapMonth(e.target.value)} className="px-3 py-2 rounded-lg border text-xs font-bold" />
                    <button onClick={() => setSortDesc(!sortDesc)} className="px-3 py-2 rounded-lg bg-slate-100 text-xs font-bold">
                      Urut Disetujui: {sortDesc ? 'Tertinggi ↓' : 'Terendah ↑'}
                    </button>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={exportCsv} className="px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Export CSV</button>
                    <button onClick={() => window.print()} className="px-3.5 py-2 rounded-xl bg-[#034276] text-white text-xs font-bold">Cetak</button>
                  </div>
                </div>
                <div className="bg-white rounded-2xl border overflow-x-auto">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 border-b text-xs font-bold">
                      <tr>
                        <th className="p-3.5">Nama Teknisi</th>
                        <th className="p-3.5 text-right">Total Laporan</th>
                        <th className="p-3.5 text-right">Disetujui</th>
                        <th className="p-3.5 text-right">Menunggu</th>
                        <th className="p-3.5 text-right">Ditolak</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {recapRows.map((row) => (
                        <tr key={row.id}>
                          <td className="p-3.5 font-bold">{row.name}</td>
                          <td className="p-3.5 text-right font-bold">{row.total}</td>
                          <td className="p-3.5 text-right font-extrabold text-emerald-600">{row.approved}</td>
                          <td className="p-3.5 text-right text-amber-600 font-bold">{row.pending}</td>
                          <td className="p-3.5 text-right text-rose-600 font-bold">{row.rejected}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {tab === 'reward' && (
              <div className="space-y-4">
                {currentUser.role === 'admin' && (
                  <div className="bg-white p-4 rounded-2xl border grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                    <div>
                      <label className="block font-bold mb-1">Periode Reward</label>
                      <input type="month" value={rewardCfg.period} onChange={(e) => setRewardCfg({ ...rewardCfg, period: e.target.value })} className="w-full px-3 py-2 rounded-lg border font-bold" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Nominal / Laporan Valid</label>
                      <input type="number" value={rewardCfg.rewardPerApproved} onChange={(e) => setRewardCfg({ ...rewardCfg, rewardPerApproved: Number(e.target.value) })} className="w-full px-3 py-2 rounded-lg border font-bold" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Min. Laporan Bonus</label>
                      <input type="number" value={rewardCfg.minApprovedForBonus} onChange={(e) => setRewardCfg({ ...rewardCfg, minApprovedForBonus: Number(e.target.value) })} className="w-full px-3 py-2 rounded-lg border font-bold" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">Nominal Bonus</label>
                      <input type="number" value={rewardCfg.bonusAmount} onChange={(e) => setRewardCfg({ ...rewardCfg, bonusAmount: Number(e.target.value) })} className="w-full px-3 py-2 rounded-lg border font-bold" />
                    </div>
                  </div>
                )}
                <div className="bg-white rounded-2xl border p-4 space-y-3">
                  <div className="text-xs text-slate-600">{rewardCfg.criteriaDescription}</div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 border-b text-xs">
                        <tr>
                          <th className="p-3">Teknisi</th>
                          <th className="p-3 text-right">Laporan Valid</th>
                          <th className="p-3 text-right">Total Reward</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y text-xs">
                        {rewardRows
                          .filter((x) => currentUser.role === 'admin' || x.id === currentUser.id)
                          .map((r) => (
                            <tr key={r.id}>
                              <td className="p-3 font-bold">{r.name}</td>
                              <td className="p-3 text-right font-bold text-emerald-700">{r.validCount}</td>
                              <td className="p-3 text-right font-extrabold text-[#034276]">{formatIDR(r.totalReward)}</td>
                              <td className="p-3">
                                {currentUser.role === 'admin' ? (
                                  <select
                                    value={r.payoutStatus}
                                    onChange={(e) => setRewardPayouts({ ...rewardPayouts, [r.key]: e.target.value })}
                                    className="px-2.5 py-1 rounded-lg border bg-white font-bold"
                                  >
                                    <option>Belum Diproses</option>
                                    <option>Diproses</option>
                                    <option>Sudah Dibayarkan</option>
                                  </select>
                                ) : (
                                  <span className="font-bold">{r.payoutStatus}</span>
                                )}
                              </td>
                            </tr>
                          ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>

          {activeReport && (
            <div className="fixed inset-0 z-50 bg-slate-900/75 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-2xl rounded-2xl overflow-hidden shadow-2xl">
                <div className="bg-[#034276] text-white px-5 py-3.5 flex justify-between items-center">
                  <span className="font-extrabold text-sm">{activeReport.id} — {activeReport.customerName}</span>
                  <button onClick={() => { setActiveReport(null); setRejectOpen(false); }} className="text-xs font-bold px-2 py-1 rounded bg-white/10">Tutup ✕</button>
                </div>
                <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[80vh] overflow-y-auto">
                  <img src={activeReport.screenshot} alt="Bukti" className="w-full max-h-80 object-contain rounded-xl border bg-slate-50" />
                  <div className="space-y-3 text-xs">
                    <div><StatusBadge status={activeReport.status} /></div>
                    <div><strong>Teknisi:</strong> {activeReport.technicianName} ({activeReport.branch})</div>
                    <div><strong>Layanan:</strong> {activeReport.serviceType}</div>
                    <div><strong>Tanggal:</strong> {activeReport.reviewDate}</div>
                    {activeReport.status === 'Ditolak' && <div className="p-2.5 rounded-lg bg-rose-50 text-rose-700 font-semibold">Alasan: {activeReport.rejectionReason}</div>}
                    {currentUser.role === 'admin' && (
                      <div className="pt-2 border-t space-y-2.5">
                        <input value={noteInput} onChange={(e) => setNoteInput(e.target.value)} placeholder="Catatan internal admin..." className="w-full px-3 py-2 rounded-lg border" />
                        {!rejectOpen ? (
                          <div className="grid grid-cols-2 gap-2">
                            <button onClick={() => verifyReport(activeReport.id, 'Disetujui')} className="py-2 rounded-xl bg-emerald-600 text-white font-extrabold">Setujui Laporan</button>
                            <button onClick={() => setRejectOpen(true)} className="py-2 rounded-xl bg-rose-600 text-white font-extrabold">Tolak Laporan</button>
                          </div>
                        ) : (
                          <div className="p-3 rounded-xl bg-rose-50 border space-y-2">
                            <select value={reasonChoice} onChange={(e) => setReasonChoice(e.target.value)} className="w-full px-2.5 py-2 rounded-lg border bg-white font-semibold">
                              {REJECTION_REASONS.map((x) => <option key={x}>{x}</option>)}
                              <option>Lainnya</option>
                            </select>
                            {reasonChoice === 'Lainnya' && <input value={customReason} onChange={(e) => setCustomReason(e.target.value)} placeholder="Tulis alasan..." className="w-full px-2.5 py-2 rounded-lg border bg-white" />}
                            <button onClick={() => verifyReport(activeReport.id, 'Ditolak')} className="w-full py-2 rounded-lg bg-rose-600 text-white font-extrabold">Konfirmasi Tolak</button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          <nav className="md:hidden fixed bottom-0 inset-x-0 bg-white border-t grid grid-cols-4 h-16 z-40 no-print">
            {menus.map((m) => (
              <button
                key={m.id}
                onClick={() => setTab(m.id)}
                className={`text-[11px] font-bold flex items-center justify-center ${tab === m.id ? 'text-[#034276] border-t-2 border-[#FEBA12] bg-blue-50/50' : 'text-slate-500'}`}
              >
                {m.label}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
